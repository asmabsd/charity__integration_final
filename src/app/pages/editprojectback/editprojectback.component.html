<div class="max-w-3xl mx-auto p-6">
    <h2 class="text-3xl font-bold text-yellow-700 mb-6 text-center">Edit Project</h2>
  <div class="max-w-3xl mx-auto p-6">
  <h2 class="text-3xl font-bold text-yellow-700 mb-6 text-center">Edit Project</h2>

  <div *ngIf="project.projectId === 0">Loading project...</div> <!-- Debugging message -->
  
  <form *ngIf="project.projectId !== 0" (ngSubmit)="updateProject()">
    <!-- Form fields here -->
  </form>
</div>
    <form (ngSubmit)="updateProject()">
      <div class="mb-4">
        <label for="titre" class="block text-gray-700">Titre</label>
        <input type="text" id="titre" [(ngModel)]="project.titre" name="titre" class="w-full p-2 border border-gray-300 rounded" required />
      </div>
  
      <div class="mb-4">
        <label for="associationId" class="block text-gray-700">Association ID</label>
        <input type="number" id="associationId" [(ngModel)]="project.associationId" name="associationId" class="w-full p-2 border border-gray-300 rounded" required />
      </div>
  
      <div class="mb-4">
        <label for="dateSignature" class="block text-gray-700">Date de Signature</label>
        <input type="date" id="dateSignature" [(ngModel)]="project.dateSignature" name="dateSignature" class="w-full p-2 border border-gray-300 rounded" required />
      </div>
  
      <div class="mb-4">
        <label for="budget" class="block text-gray-700">Budget</label>
        <input type="number" id="budget" [(ngModel)]="project.budget" name="budget" class="w-full p-2 border border-gray-300 rounded" required />
      </div>
  
      <div class="mb-4">
        <label for="type_sponsoring" class="block text-gray-700">Type de Sponsoring</label>
        <select id="type_sponsoring" [(ngModel)]="project.type_sponsoring" name="type_sponsoring" class="w-full p-2 border border-gray-300 rounded">
          <option value="MATERIEL">MATERIEL</option>
          <option value="FINANCIERE">FINANCIERE</option>
        </select>
      </div>
  
      <div class="mb-4">
        <label for="projectStatus" class="block text-gray-700">Statut</label>
        <select id="projectStatus" [(ngModel)]="project.projectStatus" name="projectStatus" class="w-full p-2 border border-gray-300 rounded">
          <option value="OUVERT">OUVERT</option>
          <option value="EN_ATTENTE">EN ATTENTE</option>
          <option value="FERME">FERME</option>
        </select>
      </div>
  
      <div class="text-center">
        <button type="submit" class=" padding-x-4  bg-yellow-500 text-white rounded-lg hover:bg-yellow-600">Update Project</button>
      </div>
    </form>
  </div>
