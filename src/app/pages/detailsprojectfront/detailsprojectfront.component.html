<div class="max-w-3xl mx-auto p-6">
    <h2 class="text-3xl font-bold text-yellow-700 mb-6 text-center">Détails du Projet</h2>
  
    <div *ngIf="loading" class="text-yellow-500 text-center">Chargement...</div>
    <div *ngIf="error" class="text-red-600 text-center">{{ error }}</div>
  
    <div *ngIf="project" class="bg-white rounded-xl shadow-lg p-6 space-y-4 border border-yellow-200">
      <h3 class="text-2xl font-bold text-gray-800">{{ project.titre }}</h3>
  
      <p><strong>ID Association:</strong> {{ project.associationId }}</p>
      <p><strong>Date de signature:</strong> {{ project.dateSignature }}</p>
      <p><strong>Budget:</strong> {{ project.budget | currency:'EUR' }}</p>
      <p><strong>Type de sponsoring:</strong> {{ project.type_sponsoring }}</p>
      <p>
        <strong>Statut:</strong>
        <span [ngClass]="{
          'text-green-600 font-semibold': project.projectStatus === 'OUVERT',
          'text-yellow-500 font-semibold': project.projectStatus === 'EN_ATTENTE',
          'text-red-600 font-semibold': project.projectStatus === 'FERME'
        }">
          {{ project.projectStatus }}
        </span>
      </p>
  
      <div class="text-center mt-6">
        <button (click)="backToList()" class="px-5 padding-x-4  bg-yellow-500 hover:bg-yellow-600 text-white rounded-lg transition">
          ← Retour à la liste
        </button>
      </div>
    </div>
  </div>
