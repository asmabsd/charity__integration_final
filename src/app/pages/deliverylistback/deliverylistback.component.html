<!-- src/app/components/delivery-list/delivery-list.component.html -->

<div class="delivery-list-container">
    <h2>All Deliveries</h2>
  
    <div *ngIf="errorMessage" class="error-message">
      {{ errorMessage }}
    </div>

   
         
      
       
        
    <div class="max-w-5xl mx-auto p-6">
        <h2 class="text-3xl font-bold text-yellow-700 mb-6 text-center">Liste des Projets</h2>
        <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet">
      
        <div class="d-flex justify-content-between align-items-center mb-3">
          <h3>My  Projects</h3>
         
      
          <a [routerLink]="['/dashboard/adddelivery']"
          class="btn btn-view flex items-center justify-center">
          <i class="fas fa-eye mr-2"></i> + New Delivery
        </a>
        </div>
  
    <table *ngIf="deliveries.length > 0" class="delivery-table">
      <thead>
        <tr>
          <th>ID</th>
          <th>Donation ID</th>
          <th>Pickup Location</th>
          <th>Drop-off Location</th>
          <th>Status</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let delivery of deliveries">
          <td>{{ delivery.id }}</td>
          <td>{{ delivery.donationId }}</td>
          <td>{{ delivery.pickupLocation }}</td>
          <td>{{ delivery.dropOffLocation }}</td>
          <td>{{ delivery.status }}</td>
          <td class="actions">
            <button class="btn-edit" [routerLink]="['/dashboard/viewdelivery', delivery.id]">
              <i class="fa fa-eye"></i> View
            </button>
           <!-- Button with routerLink for navigation -->
<button class="btn-edit" [routerLink]="['/dashboard/editdelivery', delivery.id]">
    <i class="fa fa-pencil"></i> Edit
  </button>
  
            <button class="btn-delete" (click)="deleteDelivery(delivery.id ?? 0)">
              <i class="fa fa-trash"></i> Delete
            </button>
          </td>
        </tr>
      </tbody>
    </table>
  
    <div *ngIf="deliveries.length === 0" class="no-deliveries">
      No deliveries found.
    </div>
  </div>
