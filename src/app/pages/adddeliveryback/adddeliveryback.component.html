<!-- src/app/components/add-delivery/add-delivery.component.html -->

<div class="add-delivery-container">
    <h2>Add New Delivery</h2>
  
    <form (ngSubmit)="addDelivery()">
      <div class="form-group">
        <label for="donationId">Donation ID:</label>
        <input type="number" id="donationId" [(ngModel)]="delivery.donationId" name="donationId" required>
      </div>
  
      <div class="form-group">
        <label for="pickupLocation">Pickup Location:</label>
        <input type="text" id="pickupLocation" [(ngModel)]="delivery.pickupLocation" name="pickupLocation" required>
      </div>
  
      <div class="form-group">
        <label for="dropOffLocation">Drop-off Location:</label>
        <input type="text" id="dropOffLocation" [(ngModel)]="delivery.dropOffLocation" name="dropOffLocation" required>
      </div>
  
      <div class="form-group">
        <label for="status">Status:</label>
        <select id="status" [(ngModel)]="delivery.status" name="status" required>
          <option *ngFor="let status of statusEnum | keyvalue" [value]="status.key">{{ status.value }}</option>
        </select>
      </div>
  
      <button type="submit" class="btn-submit">Add Delivery</button>

      <br>
      <br>

      
  <button type="button" class="btn-redirect" (click)="goToList()">Back to List</button>

  
    </form>
  
    <div *ngIf="successMessage" class="success-message">{{ successMessage }}</div>
    <div *ngIf="errorMessage" class="error-message">{{ errorMessage }}</div>
  </div>
