<!-- src/app/pages/blog/blog-detail.component.html -->
<div class="container mx-auto max-w-4xl my-8 px-4" *ngIf="post">
  <!-- Hero image section -->
  <div class="mb-6 rounded-lg overflow-hidden shadow-lg" *ngIf="post?.imageUrl">
    <img [src]="post.imageUrl" [alt]="post.title" class="w-full h-auto object-cover">
  </div>
  
  <h1 class="text-3xl font-bold mb-3">{{ post?.title }}</h1>
  
  <div class="flex items-center text-gray-600 mb-6">
    <div class="flex items-center">
      <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 mr-2" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
      </svg>
      <span>{{ post?.authorName }}</span>
    </div>
    
    <div class="mx-3">•</div>
    
    <div class="flex items-center">
      <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 mr-2" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z" />
      </svg>
      <span>{{ post?.createdDate | date:'mediumDate' }}</span>
    </div>
  </div>
  
  <!-- Divider -->
  <div class="border-b border-gray-300 mb-6"></div>
  
  <!-- Post content -->
  <div class="post-content prose max-w-none" [innerHTML]="safeContent"></div>
</div>
