<!-- src/app/components/sponsoring-list/sponsoring-list.component.html -->
<div class="sponsoring-list-container">
    <h2>Sponsoring List</h2>
  
    <table *ngIf="sponsorings.length > 0" class="sponsoring-table">
      <thead>
        <tr>
          <th>ID</th>
          <th>Project ID</th>
          <th>Date of Signature</th>
          <th>Approved Amount</th>
          <th>Contract</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let sponsoring of sponsorings">
          <td>{{ sponsoring.idSponsoring }}</td>
          <td>{{ sponsoring.project_id }}</td>
          <td>{{ sponsoring.date_signature }}</td>
          <td>{{ sponsoring.montant_approuvee }}</td>
          <td>{{ sponsoring.contrat }}</td>
          <td>

            <button class="btn-submit" (click)="viewSponsoring(sponsoring.idSponsoring)">
                <i class="fas fa-eye"></i> details
              </button>

              <button class="btn-pdf" (click)="downloadContractPDF(sponsoring)">
                <i class="fas fa-file-pdf"></i> Download Contract
              </button>
              

          
            <button class="delete-button" (click)="deleteSponsoring(sponsoring)">
              <i class="fas fa-trash"></i> Delete
            </button>

            <button class="global-contact-button" (click)="contactSponsor(sponsoring.idSponsoring)">
                <i class="fas fa-envelope"></i> Contact your sponsor
              </button>
         
          </td>
        </tr>
      </tbody>
    </table>

    <div *ngIf="sponsorings.length === 0" class="no-sponsorings">No sponsorings found.</div>
  </div>
  <button class="global-contact-button" (click)="goBack()">
    <span class="icon-bubble">
      <i class="fas fa-hands-helping"></i> <!-- Helping hands icon -->
    </span>
    <span>Add us by supporting more projects!</span>
  </button>
